name: Build Release

on:
  workflow_dispatch:
    inputs:
      dryRun:
        type: boolean
        description: Dry run without creating GitHub release
        required: false
        default: false

permissions:
  contents: write

env:
  PACKAGE_JSON: ./package.json
  RELEASE_TEMPLATE: ./RELEASE TEMPLATE.md

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package info
        id: pkg
        shell: bash
        run: |
          VERSION="$(jq -r '.version' '${{ env.PACKAGE_JSON }}')"
          NAME="$(jq -r '.name' '${{ env.PACKAGE_JSON }}')"
          DISPLAY_NAME="$(jq -r '.displayName // .name' '${{ env.PACKAGE_JSON }}')"
          SAFE_DISPLAY_NAME="$(echo "$DISPLAY_NAME" | tr ' ' '_' | tr -cd '[:alnum:]_.-')"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "display_name=$DISPLAY_NAME" >> "$GITHUB_OUTPUT"
          echo "safe_display_name=$SAFE_DISPLAY_NAME" >> "$GITHUB_OUTPUT"

      - name: Generate release names
        id: rel
        shell: bash
        run: |
          TAG="v${{ steps.pkg.outputs.version }}"
          ZIP_FILE="${{ steps.pkg.outputs.safe_display_name }}-${{ steps.pkg.outputs.version }}.zip"
          UNITYPACKAGE_FILE="${{ steps.pkg.outputs.safe_display_name }}-${{ steps.pkg.outputs.version }}.unitypackage"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "unitypackage_file=$UNITYPACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Check whether tag already exists
        id: tagcheck
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.rel.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if tag already exists
        if: ${{ steps.tagcheck.outputs.exists == 'true' }}
        shell: bash
        run: |
          echo "Tag already exists: ${{ steps.rel.outputs.tag }}"
          exit 1

      - name: Create source ZIP for UPM users
        shell: bash
        run: |
          git archive \
            --format=zip \
            --output "${{ steps.rel.outputs.zip_file }}" \
            HEAD

      - name: Build unitypackage meta list
        shell: bash
        run: |
          rm -f metaList

          # Put the exact asset roots you want in the .unitypackage here.
          # Add/remove lines to match your repo.
          ROOTS=(
            "./Editor"
            "./Shaders"
            "./MDMX Default.mat"
          )

          for path in "${ROOTS[@]}"; do
            if [ -d "$path" ]; then
              find "$path" -type f -name '*.meta' >> metaList
            elif [ -f "$path.meta" ]; then
              echo "$path.meta" >> metaList
            elif [ -f "$path" ] && [[ "$path" == *.meta ]]; then
              echo "$path" >> metaList
            else
              echo "Missing package root or meta: $path"
              exit 1
            fi
          done

          sort -u metaList -o metaList

          echo "=== metaList ==="
          cat metaList

          test -s metaList

      - name: Create unitypackage
        uses: pCYSl5EDgo/create-unitypackage@cfcd3cf0391a5ef1306342794866a9897c32af0b
        with:
          package-path: ${{ steps.rel.outputs.unitypackage_file }}
          include-files: metaList

      - name: Verify artifacts
        shell: bash
        run: |
          ls -lah
          test -f "${{ steps.rel.outputs.zip_file }}"
          test -f "${{ steps.rel.outputs.unitypackage_file }}"

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          if [ -f "${{ env.RELEASE_TEMPLATE }}" ]; then
            {
              echo "content<<EOF"
              cat "${{ env.RELEASE_TEMPLATE }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "content<<EOF"
              echo "Release ${{ steps.rel.outputs.tag }}"
              echo
              echo "UPM package: \`${{ steps.pkg.outputs.name }}\`"
              echo "Version: \`${{ steps.pkg.outputs.version }}\`"
              echo "Includes both UPM source ZIP and legacy .unitypackage."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: ${{ github.event.inputs.dryRun != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.pkg.outputs.display_name }} ${{ steps.pkg.outputs.version }}
          generate_release_notes: false
          body: ${{ steps.notes.outputs.content }}
          files: |
            ${{ steps.rel.outputs.zip_file }}
            ${{ steps.rel.outputs.unitypackage_file }}
            package.json
